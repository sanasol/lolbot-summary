services:
  bot:
    build: .
    image: telegram-summary-bot
    ports:
      - "1180:80"
    volumes:
      # Mount source code but not overwrite system files
      - ./src:/app/src
      - ./config:/app/config
      - ./composer.json:/app/composer.json
      - ./composer.lock:/app/composer.lock
      - ./Caddyfile:/etc/caddy/Caddyfile
      # Persistent data storage
      - ./data:/app/data
      - caddy_data:/data
      - caddy_config:/config
    working_dir: /app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - OPENROUTER_KEY=${OPENROUTER_KEY}
      - STATBATE_API_TOKEN=${STATBATE_API_TOKEN}
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-10.77.0.7}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-30124}
      - HUIHUI_CHAT_ENABLED=${HUIHUI_CHAT_ENABLED:-false}
      - HUIHUI_CHAT_API_URL=${HUIHUI_CHAT_API_URL:-}
      - HUIHUI_CHAT_API_KEY=${HUIHUI_CHAT_API_KEY:-}
      - HUIHUI_CHAT_MODEL=${HUIHUI_CHAT_MODEL:-}
      - HUIHUI_CHAT_TIMEOUT=${HUIHUI_CHAT_TIMEOUT:-180}
      - HUIHUI_CHAT_MAX_TOKENS=${HUIHUI_CHAT_MAX_TOKENS:-1024}
      - HUIHUI_CHAT_MAX_CONTEXT_CHARS=${HUIHUI_CHAT_MAX_CONTEXT_CHARS:-12000}
      - HUIHUI_CACHE_PROMPT=${HUIHUI_CACHE_PROMPT:-true}
      - HUIHUI_STREAM=${HUIHUI_STREAM:-true}
      - HUIHUI_ROUTER_SLOT=${HUIHUI_ROUTER_SLOT:-0}
      - HUIHUI_CHAT_SLOT=${HUIHUI_CHAT_SLOT:-1}
      - HUIHUI_AGENT_SLOT=${HUIHUI_AGENT_SLOT:-2}
      - SERVER_NAME=${SERVER_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis

  queue-worker:
    build: .
    image: telegram-summary-bot
    volumes:
      # Mount source code but not overwrite system files
      - ./src:/app/src
      - ./config:/app/config
      - ./composer.json:/app/composer.json
      - ./composer.lock:/app/composer.lock
      # Persistent data storage
      - ./data:/app/data
    working_dir: /app
    restart: unless-stopped
    # Disable inherited FrankenPHP health check (queue-worker doesn't run Caddy)
    healthcheck:
      test: ["CMD", "pgrep", "-f", "queue_worker"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - OPENROUTER_KEY=${OPENROUTER_KEY}
      - STATBATE_API_TOKEN=${STATBATE_API_TOKEN}
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-10.77.0.7}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-30124}
      - HUIHUI_CHAT_ENABLED=${HUIHUI_CHAT_ENABLED:-false}
      - HUIHUI_CHAT_API_URL=${HUIHUI_CHAT_API_URL:-}
      - HUIHUI_CHAT_API_KEY=${HUIHUI_CHAT_API_KEY:-}
      - HUIHUI_CHAT_MODEL=${HUIHUI_CHAT_MODEL:-}
      - HUIHUI_CHAT_TIMEOUT=${HUIHUI_CHAT_TIMEOUT:-180}
      - HUIHUI_CHAT_MAX_TOKENS=${HUIHUI_CHAT_MAX_TOKENS:-1024}
      - HUIHUI_CHAT_MAX_CONTEXT_CHARS=${HUIHUI_CHAT_MAX_CONTEXT_CHARS:-12000}
      - HUIHUI_CACHE_PROMPT=${HUIHUI_CACHE_PROMPT:-true}
      - HUIHUI_STREAM=${HUIHUI_STREAM:-true}
      - HUIHUI_ROUTER_SLOT=${HUIHUI_ROUTER_SLOT:-0}
      - HUIHUI_CHAT_SLOT=${HUIHUI_CHAT_SLOT:-1}
      - HUIHUI_AGENT_SLOT=${HUIHUI_AGENT_SLOT:-2}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_CONSUME_WEBHOOKS=true
      - WORKER_PERIODIC_ENABLED=false
      - WORKER_QUEUE_WAIT_MS=1000
    depends_on:
      - redis
    command: php /app/src/queue_worker.php
    deploy:
      replicas: 3

  periodic-worker:
    build: .
    image: telegram-summary-bot
    volumes:
      # Mount source code but not overwrite system files
      - ./src:/app/src
      - ./config:/app/config
      - ./composer.json:/app/composer.json
      - ./composer.lock:/app/composer.lock
      # Persistent data storage
      - ./data:/app/data
    working_dir: /app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "queue_worker"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - OPENROUTER_KEY=${OPENROUTER_KEY}
      - STATBATE_API_TOKEN=${STATBATE_API_TOKEN}
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-10.77.0.7}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-30124}
      - HUIHUI_CHAT_ENABLED=${HUIHUI_CHAT_ENABLED:-false}
      - HUIHUI_CHAT_API_URL=${HUIHUI_CHAT_API_URL:-}
      - HUIHUI_CHAT_API_KEY=${HUIHUI_CHAT_API_KEY:-}
      - HUIHUI_CHAT_MODEL=${HUIHUI_CHAT_MODEL:-}
      - HUIHUI_CHAT_TIMEOUT=${HUIHUI_CHAT_TIMEOUT:-180}
      - HUIHUI_CHAT_MAX_TOKENS=${HUIHUI_CHAT_MAX_TOKENS:-1024}
      - HUIHUI_CHAT_MAX_CONTEXT_CHARS=${HUIHUI_CHAT_MAX_CONTEXT_CHARS:-12000}
      - HUIHUI_CACHE_PROMPT=${HUIHUI_CACHE_PROMPT:-true}
      - HUIHUI_STREAM=${HUIHUI_STREAM:-true}
      - HUIHUI_ROUTER_SLOT=${HUIHUI_ROUTER_SLOT:-0}
      - HUIHUI_CHAT_SLOT=${HUIHUI_CHAT_SLOT:-1}
      - HUIHUI_AGENT_SLOT=${HUIHUI_AGENT_SLOT:-2}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_CONSUME_WEBHOOKS=false
      - WORKER_PERIODIC_ENABLED=true
    depends_on:
      - redis
    command: php /app/src/queue_worker.php

  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  redis_data:
